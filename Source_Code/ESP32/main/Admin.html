<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ESP32 WiFi Config</title>
<!-- --------------------------------------------------CSS---------------------------------------------------- -->
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        padding: 20px;
    }

    h2 { text-align: center; }

    .center-btn {
        display: flex;
        justify-content: center;
        margin-top: 20px;
    }

    #wifiList {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .wifi-item {
        background: white;
        padding: 12px;
        width: 500px;
        margin-bottom: 8px;
        border-radius: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        border: 1px solid #ddd;
    }


    .wifi-name {
        font-size: 16px;
        font-weight: bold;
    }


    .icons {
        display: flex;
        gap: 10px;
        align-items: center;
    }


    .lock {
        color: #d9534f;
        font-size: 18px;
    }


    /* ICON SÓNG WIFI KIỂU iPHONE */
    .wifi-icon {
        width: 22px;
        height: 18px;
        position: relative;
        display: inline-block;
    }


    .wifi-icon span {
        position: absolute;
        bottom: 0;
        width: 4px;
        background: #000;
        border-radius: 2px;
        opacity: 0.2;
    }


    .wifi-icon .bar1 { height: 4px; left: 0px; }
    .wifi-icon .bar2 { height: 8px; left: 6px; }
    .wifi-icon .bar3 { height: 12px; left: 12px; }
    .wifi-icon .bar4 { height: 16px; left: 18px; }


    .wifi-signal-1 .bar1 { opacity: 1; }
    .wifi-signal-2 .bar1, .wifi-signal-2 .bar2 { opacity: 1; }
    .wifi-signal-3 .bar1, .wifi-signal-3 .bar2, .wifi-signal-3 .bar3 { opacity: 1; }
    .wifi-signal-4 .bar1, .wifi-signal-4 .bar2, .wifi-signal-4 .bar3, .wifi-signal-4 .bar4 { opacity: 1; }


    /* Popup nhập mật khẩu */
    #passwordPopup {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        display: none;
        justify-content: center;
        align-items: center;
    }


    #popupBox {
        background: white;
        padding: 20px;
        border-radius: 8px;
        width: 300px;
        text-align: center;
    }


    input {
        width: 90%;
        padding: 8px;
        margin-top: 10px;
    }


    button {
        padding: 10px 20px;
        margin: 10px;
        cursor: pointer;
        border-radius: 6px;
        color: white;
        border: none;
    }

    #scan_wifi {
        background: #3498db;
    }

    #forget_wifi {
        background: #c9302c;
    }

    #disconnect_wifi {
        background: #3498db;
    }

    #connectBtn {
        background: #3498db;
    }

    #closeBtn {
        background: #c9302c;
    }

    #connectBtn:disabled {
        background: #ccc;
        cursor: not-allowed;
    }
    /* Loading kiểu iPhone */
#loadingBox {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    justify-content: center;
    align-items: center;
}


.loader {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #3498db;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 0.8s linear infinite;
}

#connectedPopup {
    position: fixed; 
    top:0; left:0; 
    width:100%; 
    height:100%;
    background: rgba(0,0,0,0.5); 
    display:none;
    justify-content:center; 
    align-items:center;
}

#connectedPopupBox {
    background:white; 
    padding:20px; 
    border-radius:8px; 
    width:300px; 
    text-align:center;
}
#exitBar {
    position: fixed;
    top: 12px;
    right: 16px;
    z-index: 1000;
}

#exitBtn {
    background: #d9534f;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
}

#exitBtn:hover {
    background: #c9302c;
}


@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>

<!-- ----------------------------------------------------HTML----------------------------------------------------- -->
</head>
<body>

<div id="exitBar">
    <button id="exitBtn" onclick="exitAP()">Thoát</button>
</div>
<h2>Cấu hình WiFi ESP32</h2>
<div class="center-btn">
    <button id="scan_wifi" onclick="scanWifi()">Scan WiFi</button>
</div>


<div id="wifiList"></div>

<!-- Popup nhập mật khẩu -->
<div id="passwordPopup">
    <div id="popupBox">
        <h3 id="popupSSID"></h3>
        <input type="password" id="passwordInput" placeholder="Nhập mật khẩu WiFi">
        <br>
        <button id="connectBtn" disabled onclick="connectWifi()">Kết nối</button>
        <button id="closeBtn" onclick="closePopup()">Hủy bỏ</button>
    </div>
    <div id="loadingBox">
        <div class="loader"></div>
    </div>


</div>


<div id="connectedPopup" onclick="outsideClick(event)">
    <div id="connectedPopupBox" onclick="event.stopPropagation()">
        <h3 id="connectedSSIDName"></h3>
        <button id="forget_wifi" onclick="forgetNetwork()">Quên mạng này</button>
        <button id="disconnect_wifi" onclick="disconnectNetwork()">Ngắt kết nối</button>
    </div>
</div>
<!-- -------------------------------------------------SCRIPT---------------------------------------------------- -->
<script>
/* ================== STATE ================== */
let selectedSSID = "";
let connectedSSID = "";
let wifiSecure = false;

let lastScanResult = [];
let scanInProgress = false;

let wifiState = "idle"; // idle | connecting | got_ip | reconnecting | fail
let isConnecting = false;

let wifiStatusTimer = null;
let wifiCurrentTimer = null;

/* ================== INIT ================== */
document.addEventListener("DOMContentLoaded", () => {
    startWifiCurrentPolling();
});

/* ================== WIFI CURRENT ================== */
function fetchConnectedWifi() {
    if (isConnecting) return;

    fetch("/wifi_current")
        .then(res => res.json())
        .then(data => {
            if (data.connected) {
                connectedSSID = data.ssid;
                wifiSecure = data.secure;
                wifiState = "got_ip";
            } else {
                connectedSSID = "";
                wifiState = "idle";
            }
            renderWifiList();
        })
        .catch(() => {
            wifiState = "idle";
        });
}

function startWifiCurrentPolling() {
    if (wifiCurrentTimer) return;
    fetchConnectedWifi();
    wifiCurrentTimer = setInterval(fetchConnectedWifi, 2000);
}

function stopWifiCurrentPolling() {
    if (!wifiCurrentTimer) return;
    clearInterval(wifiCurrentTimer);
    wifiCurrentTimer = null;
}

/* ================== WIFI STATUS ================== */
function startWifiStatusPolling() {
    stopWifiStatusPolling();

    wifiStatusTimer = setInterval(() => {
        fetch("/wifi_status")
            .then(res => res.json())
            .then(data => {
                wifiState = data.status;
                console.log("wifi_status:", wifiState);

                if (wifiState === "connecting") return;

                if (wifiState === "got_ip") {
                    onWifiConnected();
                }

                if (wifiState === "fail") {
                    onWifiConnectFail();
                }

                if (wifiState === "reconnecting") {
                    renderWifiList();
                }
            })
            .catch(() => {
                onWifiConnectFail();
            });
    }, 2000);
}

function stopWifiStatusPolling() {
    if (!wifiStatusTimer) return;
    clearInterval(wifiStatusTimer);
    wifiStatusTimer = null;
}

/* ================== CONNECT CALLBACK ================== */
function onWifiConnected() {
    console.log("WiFi connected");

    isConnecting = false;
    stopWifiStatusPolling();
    // stopWifiCurrentPolling();

    setTimeout(() => {
        // startWifiCurrentPolling();
    }, 500);

    document.getElementById("loadingBox").style.display = "none";
    closePopup();
    renderWifiList();
}

function onWifiConnectFail() {
    console.log("WiFi connect failed");

    isConnecting = false;
    wifiState = "fail";

    stopWifiStatusPolling();
    // startWifiCurrentPolling();

    document.getElementById("loadingBox").style.display = "none";
    alert("Sai mật khẩu hoặc không kết nối được WiFi");
    renderWifiList();
}

/* ================== SCAN ================== */
function scanWifi() {
    stopWifiCurrentPolling();
    if (scanInProgress) return; //tránh user Scan liên tục
    scanInProgress = true;

    showScanHint("Đang quét WiFi...");
    fetch("/scan_wifi");

    const timer = setInterval(() => {
        fetch("/scan_result")
            .then(res => res.json())
            .then(data => {
                if (data.status === "running") return;

                if (data.status === "done") {
                    scanInProgress = false;
                    clearInterval(timer);

                    lastScanResult = data.aps || [];
                    renderWifiList(lastScanResult);
                    showScanHint("");
                    startWifiCurrentPolling();
                }
            })
            .catch(() => {
                if (!scanInProgress) return;   // ⬅️ QUAN TRỌNG
                    scanInProgress = false;
                    clearInterval(timer);
                    showScanHint("Scan lỗi");
            });
    }, 5000);
}

/* ================== UI ================== */
function renderWifiList(list = lastScanResult) {
    let html = "";
    let hasConnectedInList = false;

    list.forEach(wifi => {
        const isThisSSID = wifi.ssid === connectedSSID;
        if (isThisSSID) hasConnectedInList = true;
        let level = rssiToLevel(wifi.rssi);

        let statusText = "";
        if (isThisSSID) {
            if (wifiState === "got_ip") statusText = '<span style="color:green">Đã kết nối</span>';
            else if (wifiState === "reconnecting") statusText = '<span style="color:orange">Mất kết nối</span>';
            else if (wifiState === "fail") statusText = '<span style="color:red">Kết nối lỗi</span>';
        }

        html += `
        <div class="wifi-item"
             onclick="wifiClicked('${escapeJS(wifi.ssid)}', ${wifi.secure})">
            <div class="wifi-name">${wifi.ssid === "" ? "[Hidden SSID]" : wifi.ssid}</div>
            <div class="icons">
                ${statusText}
                ${wifi.secure ? '🔒' : ''}
                <div class="wifi-icon wifi-signal-${level}">
                    <span class="bar1"></span>
                    <span class="bar2"></span>
                    <span class="bar3"></span>
                    <span class="bar4"></span>
                </div>
            </div>
        </div>`;
    });

    if (connectedSSID && !hasConnectedInList) {
        html = `
        <div class="wifi-item"
             onclick="wifiClicked('${escapeJS(connectedSSID)}', true)">
            <div class="wifi-name">${connectedSSID}</div>
            <div class="icons">
                ${wifiState === "got_ip" ? '<span style="color:green">Đã kết nối</span>' : '<span style="color:orange">Mất kết nối</span>'}
                ${wifiSecure ? '🔒' : ''}
            </div>
        </div>` + html;
    }

    document.getElementById("wifiList").innerHTML = html;
}

/* ================== CLICK ================== */
function wifiClicked(ssid, secure) {
    selectedSSID = ssid;

    if (ssid === connectedSSID) {
        document.getElementById("connectedSSIDName").innerText = ssid;
        document.getElementById("connectedPopup").style.display = "flex";
        return;
    }

    if (!secure) {
        connectWifiDirect(ssid, "");
        return;
    }

    document.getElementById("popupSSID").innerText = ssid;
    document.getElementById("passwordPopup").style.display = "flex";
}

function connectWifiDirect(ssid, password) {
    isConnecting = true;
    wifiState = "connecting";

    // stopWifiCurrentPolling();
    startWifiStatusPolling();

    document.getElementById("loadingBox").style.display = "flex";

    fetch("/connect_wifi", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ssid, password })
    });
}

document.getElementById("passwordInput").addEventListener("input", function() {
    document.getElementById("connectBtn").disabled = this.value.length < 8;
});

function connectWifi() {
    const pass = document.getElementById("passwordInput").value;
    if (!selectedSSID || pass.length < 8) {
        alert("SSID hoặc mật khẩu không hợp lệ");
        return;
    }
    connectWifiDirect(selectedSSID, pass);
}

/* ================== POPUP ================== */
function closePopup() {
    document.getElementById("passwordPopup").style.display = "none";
    document.getElementById("passwordInput").value = "";
}

function closeConnectedPopup() {
    document.getElementById("connectedPopup").style.display = "none";
}

/* ================== UTIL ================== */
function showScanHint(text) {
    let hint = document.getElementById("scanHint");
    if (!hint) {
        hint = document.createElement("div");
        hint.id = "scanHint";
        hint.style.textAlign = "center";
        hint.style.marginTop = "10px";
        document.body.insertBefore(hint, document.getElementById("wifiList"));
    }
    hint.innerText = text;
}

function escapeJS(str) {
    return str.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

function outsideClick(event) {
    // Nếu click vào nền (không phải khung popup)
    if (event.target.id === "passwordPopup") {
        closePopup();
    }


    if (event.target.id === "connectedPopup") {
        closeConnectedPopup();
    }
}

// Popup: Quên mạng này
function forgetNetwork() {
    fetch("/forget_wifi", { method: "POST" })
        .then(res => res.json())
        .then(data => {
            if (data.status === "ok") {
                connectedSSID = "";
                document.getElementById("connectedPopup").style.display = "none";

                // chỉ render lại UI
                renderWifiList();
            } else {
                alert("Quên WiFi thất bại");
            }
        })
        .catch(() => alert("Mất kết nối tới ESP32"));
}


// Popup: Ngắt kết nối
function disconnectNetwork() {
    fetch("/disconnect_wifi", { method: "POST" })
        .then(res => res.json())
        .then(data => {
            if (data.status === "ok") {
                connectedSSID = "";
                document.getElementById("connectedPopup").style.display = "none";

                renderWifiList();
            } else {
                alert("Ngắt kết nối thất bại");
            }
        })
        .catch(() => alert("Mất kết nối tới ESP32"));
}

 //Exit AP mode
function exitAP() {
    fetch("/exit_ap", { method: "POST" })
        .then(res => res.json())
        .then(data => {
            if (data.status === "ok") {

                /*
                 * Khi ESP tắt AP:
                 * - Browser sẽ mất kết nối WiFi
                 * - reload ngay có thể fail
                 * → delay nhẹ cho an toàn
                 */
                setTimeout(() => {
                    location.reload();
                }, 1000);
            } else {
                alert("Thoát AP thất bại");
            }
        })
        .catch(err => {
            console.error(err);
            alert("Không thể gửi lệnh thoát AP");
        });
}

function rssiToLevel(rssi) {
    if (rssi > -50) return 4;
    if (rssi > -65) return 3;
    if (rssi > -75) return 2;
    return 1;
}
</script>

</body>
</html>
